name: dashboard
# Rebuilds the phone dashboard (GitHub Pages) after every watch/daily run. Reads state/, never writes it.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions". Until then this run just skips the deploy.
on:
  workflow_run:
    workflows: [watch, daily]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Is Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > /tmp/bt 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off. Turn it on: Settings -> Pages -> Source: GitHub Actions. Skipping deploy."
          fi
      - name: Build dashboard
        if: steps.pages.outputs.on == 'true'
        run: python3 dashboard.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == 'true'
        with:
          path: site
      - id: deploy
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
