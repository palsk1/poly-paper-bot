name: selftest
# Manual only: prints raw API samples and sends a test push.
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bot.py selftest
