name: watch
# Checks the wallet every ~10 minutes and records paper copies.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bot.py watch
      - name: Save state
        run: |
          git config user.name "poly-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "watch: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main
            git push
          fi
