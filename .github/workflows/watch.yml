name: watch
# Runs every 5 min: started by an outside timer (cron-job.org -> workflow_dispatch API) because
# GitHub's own schedule often skips runs for hours. The cron below stays as a backup.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bot.py watch
      - name: Save state
        run: |
          git config user.name "poly-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "watch: $(date -u +%Y-%m-%dT%H:%MZ)"
            # GitHub sometimes rejects a push with a one-off server error; retry so the run's paper trades aren't lost
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && exit 0
              echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 10))
            done
            exit 1
          fi
