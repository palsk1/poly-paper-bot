name: daily
# Once a day (before the 08:00 review): settle resolved markets, run the screener, write the summary.
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"   # backup; does nothing if the first one already ran
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run daily jobs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 bot.py daily
      - name: Save state
        run: |
          git config user.name "poly-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            # GitHub sometimes rejects a push with a one-off server error; retry so the run's paper trades aren't lost
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin main && git push && exit 0
              echo "push attempt $i failed, retrying"; sleep $((i * 10))
            done
            exit 1
          fi
