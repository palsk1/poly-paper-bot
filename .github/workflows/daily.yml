name: daily
# Once a day (before the 08:00 review): settle resolved markets, run the screener, write the summary.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run daily jobs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bot.py daily
      - name: Save state
        run: |
          git config user.name "poly-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
