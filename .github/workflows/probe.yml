name: probe
# Manual only: prints raw API shapes for debugging. No pushes, no state changes.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "all | kalshi | poly | endgame | events | fast | fast2 | fast3 (or 'arbtest' / 'dryrun' / 'discover' / 'copytest' / 'depthtest' / 'fasttest' / 'makertest' for bot dry runs; edges_* for edges.py research; lh_* for logichunt.py (markets that contradict each other); sharp_* for sharp.py (bookmaker fair price); src_* for sources.py (who reads the settle source first); fast* and fasttest = weather + crypto; 'hunt' / 'hunt_ladders' / 'hunt_dupes' / 'hunt_rejected' / 'hunt_sports2' for arbhunt.py; 'rec_once' = one recorder pass; lag_scan / lag_<minutes> = live esports lag test, livelag.py; launch_live_<min>_<follow> = watch brand-new listings, launch.py; exam_tapetest / exam_selftest = the shared exam, exam.py; btstore = copy main's Actions cache into the shared price store and list it, store_list = list it, store.py)"
        default: all

permissions:
  contents: write   # only for the shared price store (store.py, GitHub release "price-store"); probes never push to git

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4   # the branch it was started on (main by default), so a PR branch can be tried live
      - uses: actions/cache/restore@v4
        if: startsWith(inputs.what, 'bt') || startsWith(inputs.what, 'win_') || startsWith(inputs.what, 'big_')   # win_* and big_* only read the cache, never save it
        with:
          path: bt_cache
          key: bt-cache-${{ github.run_id }}
          restore-keys: bt-cache-
      - uses: actions/cache/restore@v4   # digs.py: reads the shared bt_cache but never saves it (keeps main's cache the newest)
        if: startsWith(inputs.what, 'dig_')
        with:
          path: bt_cache
          key: bt-cache-${{ github.run_id }}
          restore-keys: bt-cache-
      - uses: actions/cache/restore@v4
        if: startsWith(inputs.what, 'dig_')
        with:
          path: dig_cache
          key: dig-cache-${{ github.run_id }}
          restore-keys: dig-cache-
      - uses: actions/cache/restore@v4
        if: startsWith(inputs.what, 'econ')
        with:
          path: econ_cache
          key: econ-cache-${{ github.run_id }}
          restore-keys: econ-cache-
      - uses: actions/cache/restore@v4
        if: startsWith(inputs.what, 'wx_')
        with:
          path: wx_cache
          key: wx-cache-${{ github.run_id }}
          restore-keys: wx-cache-
      - name: Shared price store, fetch   # tops up the Actions cache with what any thread/branch saved (store.py)
        if: startsWith(inputs.what, 'bt') || startsWith(inputs.what, 'win_') || startsWith(inputs.what, 'big_') || startsWith(inputs.what, 'econ') || startsWith(inputs.what, 'wx_') || startsWith(inputs.what, 'kc_') || startsWith(inputs.what, 'kd_') || startsWith(inputs.what, 'kf_') || startsWith(inputs.what, 'kh_') || startsWith(inputs.what, 'opt_') || startsWith(inputs.what, 'tw_') || startsWith(inputs.what, 'men_') || startsWith(inputs.what, 'ern_') || startsWith(inputs.what, 'bo_') || startsWith(inputs.what, 'stk_') || startsWith(inputs.what, 'qk_') || startsWith(inputs.what, 'famf_') || startsWith(inputs.what, 'kmn_') || startsWith(inputs.what, 'kch_') || startsWith(inputs.what, 'spw_') || startsWith(inputs.what, 'hab_') || startsWith(inputs.what, 'pw_') || startsWith(inputs.what, 'sp_')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 store.py pull || true
      - name: Tennis store, fetch   # tennis.py keeps its files in ten_cache/, in its own release tennis-store (a release holds at most 1,000 files)
        if: startsWith(inputs.what, 'ten_')
        env:
          GH_TOKEN: ${{ github.token }}
        run: STORE_TAG=tennis-store python3 store.py pull ten_cache || true
      - name: Kalshi combo data, fetch   # kcombos.py keeps its own small folder so a run doesn't download the whole store
        if: startsWith(inputs.what, 'kcb_') && inputs.what != 'kcb_peek'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 store.py pull kcb_cache || true
      - name: Probe APIs
        run: |
          case "${{ inputs.what }}" in lag_*) pip install -q websockets; w="$(echo '${{ inputs.what }}' | sed 's/^lag_//')"; if [ "$w" = "scan" ]; then PYTHONUNBUFFERED=1 python3 livelag.py scan; else PYTHONUNBUFFERED=1 python3 livelag.py rec "$w"; fi; exit $?;; esac
          case "${{ inputs.what }}" in launch_*) PYTHONUNBUFFERED=1 python3 launch.py $(echo '${{ inputs.what }}' | sed 's/^launch_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in dig_*) PYTHONUNBUFFERED=1 python3 digs.py "$(echo '${{ inputs.what }}' | sed 's/^dig_//')"; exit $?;; esac
          case "${{ inputs.what }}" in btstore|store_list) python3 store.py list; exit $?;; store_selftest) python3 store.py selftest; exit $?;; esac
          case "${{ inputs.what }}" in bt*) PYTHONUNBUFFERED=1 python3 backtest.py "${{ inputs.what }}"; exit $?;; esac
          case "${{ inputs.what }}" in rec_once) python3 recorder.py once; exit $?;; rec_6) PYTHONUNBUFFERED=1 python3 recorder.py once 6; exit $?;; esac
          case "${{ inputs.what }}" in econ_*) pip install -q openpyxl; PYTHONUNBUFFERED=1 python3 econ.py "$(echo '${{ inputs.what }}' | sed 's/^econ_//')"; exit $?;; esac
          case "${{ inputs.what }}" in wx_*) PYTHONUNBUFFERED=1 python3 wxcast.py "$(echo '${{ inputs.what }}' | sed 's/^wx_//')"; exit $?;; esac
          case "${{ inputs.what }}" in opt_*) PYTHONUNBUFFERED=1 python3 optfair.py "$(echo '${{ inputs.what }}' | sed 's/^opt_//')"; exit $?;; esac
          case "${{ inputs.what }}" in tw_*) PYTHONUNBUFFERED=1 python3 tweets.py "$(echo '${{ inputs.what }}' | sed 's/^tw_//')"; exit $?;; esac
          case "${{ inputs.what }}" in men_*) PYTHONUNBUFFERED=1 python3 mentions.py "$(echo '${{ inputs.what }}' | sed 's/^men_//')"; exit $?;; esac
          case "${{ inputs.what }}" in ern_*) PYTHONUNBUFFERED=1 python3 earn.py "$(echo '${{ inputs.what }}' | sed 's/^ern_//')"; exit $?;; esac
          case "${{ inputs.what }}" in bo_*) PYTHONUNBUFFERED=1 python3 boxoffice.py "$(echo '${{ inputs.what }}' | sed 's/^bo_//')"; exit $?;; esac
          case "${{ inputs.what }}" in stk_*) PYTHONUNBUFFERED=1 python3 stocks.py "$(echo '${{ inputs.what }}' | sed 's/^stk_//')"; exit $?;; esac
          case "${{ inputs.what }}" in qk_*) PYTHONUNBUFFERED=1 python3 quakes.py "$(echo '${{ inputs.what }}' | sed 's/^qk_//')"; exit $?;; esac
          case "${{ inputs.what }}" in famf_*) PYTHONUNBUFFERED=1 python3 families.py fetch "$(echo '${{ inputs.what }}' | sed 's/^famf_//')"; exit $?;; esac
          case "${{ inputs.what }}" in fam_*) PYTHONUNBUFFERED=1 python3 families.py peek "$(echo '${{ inputs.what }}' | sed 's/^fam_//')"; exit $?;; esac
          case "${{ inputs.what }}" in tns_*) pip install -q websockets; PYTHONUNBUFFERED=1 python3 tennis.py $(echo '${{ inputs.what }}' | sed 's/^tns_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in ten_*) pip install -q websockets; PYTHONUNBUFFERED=1 timeout 285m python3 tennis.py $(echo '${{ inputs.what }}' | sed 's/^ten_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in sp_*) PYTHONUNBUFFERED=1 python3 speeches.py "$(echo '${{ inputs.what }}' | sed 's/^sp_//')"; exit $?;; esac
          case "${{ inputs.what }}" in pw_*) PYTHONUNBUFFERED=1 python3 postwords.py "$(echo '${{ inputs.what }}' | sed 's/^pw_//')"; exit $?;; esac
          case "${{ inputs.what }}" in kch_*) PYTHONUNBUFFERED=1 python3 kcharts.py "$(echo '${{ inputs.what }}' | sed 's/^kch_//')"; exit $?;; esac
          case "${{ inputs.what }}" in spw_*) PYTHONUNBUFFERED=1 python3 spotw.py "$(echo '${{ inputs.what }}' | sed 's/^spw_//')"; exit $?;; esac
          case "${{ inputs.what }}" in spd_*) pip install -q websockets; m="$(echo '${{ inputs.what }}' | sed 's/^spd_//')"; SPEED_DIR=/tmp/spd timeout "${m}m" python3 -u quoter/speedcheck.py run || true; for f in /tmp/spd/*.jsonl; do echo "$f"; python3 -c "import json,sys,collections;c=collections.Counter(json.loads(l)['k'] for l in open(sys.argv[1]));print(dict(c))" "$f"; grep -m 20 '"note"' "$f"; grep -m 3 '"k":"bk"' "$f"; grep -m 3 '"k":"cl"' "$f"; grep -m 2 '"k":"ping"' "$f"; done; python3 quoter/speedcheck.py score /tmp/spd/*.jsonl; exit 0;; esac
          case "${{ inputs.what }}" in w5m_*) PYTHONUNBUFFERED=1 python3 wallet5m.py $(echo '${{ inputs.what }}' | sed 's/^w5m_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in hab_*) PYTHONUNBUFFERED=1 python3 habits.py "$(echo '${{ inputs.what }}' | sed 's/^hab_//')"; exit $?;; esac
          case "${{ inputs.what }}" in aim_*) pip install -q pyarrow; export GH_TOKEN="${{ github.token }}"; python3 store.py pull bt_cache/aim || true; PYTHONUNBUFFERED=1 python3 aim.py "$(echo '${{ inputs.what }}' | sed 's/^aim_//')"; rc=$?; python3 store.py push bt_cache/aim || true; exit $rc;; esac   # only its own folder of the price store, so a run is quick
          case "${{ inputs.what }}" in spx_*) export GH_TOKEN="${{ github.token }}"; python3 store.py pull bt_cache/spx || true; python3 store.py pull bt_cache/aim || true; PYTHONUNBUFFERED=1 python3 spacex.py "$(echo '${{ inputs.what }}' | sed 's/^spx_//')"; rc=$?; python3 store.py push bt_cache/spx || true; exit $rc;; esac   # rocket launch counts, own folder
          case "${{ inputs.what }}" in dl_*) export GH_TOKEN="${{ github.token }}"; python3 store.py pull bt_cache/dl || true; PYTHONUNBUFFERED=1 timeout 280m python3 dates.py "$(echo '${{ inputs.what }}' | sed 's/^dl_//')"; rc=$?; python3 store.py push bt_cache/dl || true; exit $rc;; esac   # date-ladder bets (dates.py), own folder
          case "${{ inputs.what }}" in fed_*) pip install -q openpyxl; export GH_TOKEN="${{ github.token }}"; python3 store.py pull bt_cache/fed bt_cache/fam_fed_rates bt_cache/fam_cpi || true; PYTHONUNBUFFERED=1 timeout 280m python3 fed.py "$(echo '${{ inputs.what }}' | sed 's/^fed_//')"; rc=$?; python3 store.py push bt_cache/fed bt_cache/fam_fed_rates bt_cache/fam_cpi || true; exit $rc;; esac   # Fed / CPI bets vs futures (fed.py), own folder
          case "${{ inputs.what }}" in kmn_*) PYTHONUNBUFFERED=1 python3 kmentions.py "$(echo '${{ inputs.what }}' | sed 's/^kmn_//')"; exit $?;; esac
          case "${{ inputs.what }}" in kd_*) PYTHONUNBUFFERED=1 KC_WORKERS=16 timeout 270m python3 kdocs.py "$(echo '${{ inputs.what }}' | sed 's/^kd_//')"; exit $?;; esac
          case "${{ inputs.what }}" in kh_*) PYTHONUNBUFFERED=1 python3 khouse.py "$(echo '${{ inputs.what }}' | sed 's/^kh_//')"; exit $?;; esac
          case "${{ inputs.what }}" in kcb_*) PYTHONUNBUFFERED=1 timeout 270m python3 kcombos.py $(echo '${{ inputs.what }}' | sed 's/^kcb_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in khr_*) export GH_TOKEN="${{ github.token }}"; python3 store.py pull bt_cache/khr || true; case "${{ inputs.what }}" in khr_test*) export KHR_DAYS=1;; esac; PYTHONUNBUFFERED=1 KC_WORKERS=12 timeout 280m python3 khourly.py "$(echo '${{ inputs.what }}' | sed 's/^khr_//; s/^test//')"; rc=$?; python3 store.py push bt_cache/khr || true; exit $rc;; esac   # hourly / daily Kalshi crypto rounds, own folder of the price store
          case "${{ inputs.what }}" in kc_*) PYTHONUNBUFFERED=1 python3 kcrypto.py "$(echo '${{ inputs.what }}' | sed 's/^kc_//')"; exit $?;; esac
          case "${{ inputs.what }}" in kfl_*) KFL_NOSAVE=1 PYTHONUNBUFFERED=1 python3 kfastlive.py $(echo '${{ inputs.what }}' | sed 's/^kfl_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in kf_*) PYTHONUNBUFFERED=1 python3 kfast.py "$(echo '${{ inputs.what }}' | sed 's/^kf_//')"; exit $?;; esac
          case "${{ inputs.what }}" in xv_*) GH_TOKEN="${{ github.token }}" PYTHONUNBUFFERED=1 python3 xvenue.py $(echo '${{ inputs.what }}' | sed 's/^xv_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in cs2_*) GH_TOKEN="${{ github.token }}" PYTHONUNBUFFERED=1 python3 cs2.py $(echo '${{ inputs.what }}' | sed 's/^cs2_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in big_*) PYTHONUNBUFFERED=1 python3 bigbets.py "$(echo '${{ inputs.what }}' | sed 's/^big_//')"; exit $?;; esac
          case "${{ inputs.what }}" in win_*) PYTHONUNBUFFERED=1 python3 winners.py "$(echo '${{ inputs.what }}' | sed 's/^win_//')"; exit $?;; esac
          case "${{ inputs.what }}" in exam_*) PYTHONUNBUFFERED=1 python3 exam.py $(echo '${{ inputs.what }}' | sed 's/^exam_//; s/_/ /g'); exit $?;; esac
          case "${{ inputs.what }}" in cmb_*) PYTHONUNBUFFERED=1 python3 combos.py "$(echo '${{ inputs.what }}' | sed 's/^cmb_//')"; exit $?;; esac
          case "${{ inputs.what }}" in census_*) PYTHONUNBUFFERED=1 python3 census.py "$(echo '${{ inputs.what }}' | sed 's/^census_//')"; exit $?;; esac
          case "${{ inputs.what }}" in src_*) PYTHONUNBUFFERED=1 python3 sources.py "$(echo '${{ inputs.what }}' | sed 's/^src_//')"; exit $?;; esac
          case "${{ inputs.what }}" in sharp_*) PYTHONUNBUFFERED=1 python3 sharp.py "$(echo '${{ inputs.what }}' | sed 's/^sharp_//')"; exit $?;; esac
          case "${{ inputs.what }}" in lh_*) PYTHONUNBUFFERED=1 python3 logichunt.py "${{ inputs.what }}"; exit $?;; esac
          case "${{ inputs.what }}" in edges_*) python3 edges.py "$(echo '${{ inputs.what }}' | sed 's/^edges_//')"; exit $?;; esac
          if [ "${{ inputs.what }}" = "arbtest" ] || [ "${{ inputs.what }}" = "dryrun" ] || [ "${{ inputs.what }}" = "discover" ] || [ "${{ inputs.what }}" = "copytest" ] || [ "${{ inputs.what }}" = "depthtest" ] || [ "${{ inputs.what }}" = "fasttest" ] || [ "${{ inputs.what }}" = "makertest" ] || [ "${{ inputs.what }}" = "kmakertest" ] || [ "${{ inputs.what }}" = "econtest" ] || [ "${{ inputs.what }}" = "kpatienttest" ] || [ "${{ inputs.what }}" = "ktrumptest" ] || [ "${{ inputs.what }}" = "ktennistest" ]; then python3 bot.py "${{ inputs.what }}"; elif [ "${{ inputs.what }}" = "hunt" ] || [ "${{ inputs.what }}" = "hunt_ladders" ] || [ "${{ inputs.what }}" = "hunt_dupes" ] || [ "${{ inputs.what }}" = "hunt_rejected" ] || [ "${{ inputs.what }}" = "hunt_sports" ] || [ "${{ inputs.what }}" = "hunt_sports2" ]; then python3 arbhunt.py "${{ inputs.what }}"; else python3 probe.py "${{ inputs.what }}"; fi
      - name: Tennis store, save
        if: always() && startsWith(inputs.what, 'ten_')
        env:
          GH_TOKEN: ${{ github.token }}
        run: STORE_TAG=tennis-store python3 store.py push ten_cache || true
      - name: Kalshi combo data, save
        if: always() && startsWith(inputs.what, 'kcb_') && inputs.what != 'kcb_peek'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 store.py push kcb_cache || true
      - name: Shared price store, save   # also after a failure or timeout; win_* only reads
        if: always() && (startsWith(inputs.what, 'w5m_') || startsWith(inputs.what, 'bt') || startsWith(inputs.what, 'econ') || startsWith(inputs.what, 'wx_') || startsWith(inputs.what, 'kc_') || startsWith(inputs.what, 'kd_') || startsWith(inputs.what, 'kf_') || startsWith(inputs.what, 'kh_') || startsWith(inputs.what, 'opt_') || startsWith(inputs.what, 'tw_') || startsWith(inputs.what, 'men_') || startsWith(inputs.what, 'ern_') || startsWith(inputs.what, 'bo_') || startsWith(inputs.what, 'stk_') || startsWith(inputs.what, 'qk_') || startsWith(inputs.what, 'famf_') || startsWith(inputs.what, 'kmn_') || startsWith(inputs.what, 'kch_') || startsWith(inputs.what, 'spw_') || startsWith(inputs.what, 'hab_') || startsWith(inputs.what, 'pw_') || startsWith(inputs.what, 'sp_') )
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 store.py push || true
      - uses: actions/cache/save@v4   # also after a failure or timeout, so a long download isn't lost
        if: always() && startsWith(inputs.what, 'bt')
        with:
          path: bt_cache
          key: bt-cache-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && startsWith(inputs.what, 'dig_k')
        with:
          path: dig_cache
          key: dig-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(inputs.what, 'dig_')
        with:
          name: digs
          path: backtest/
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always() && startsWith(inputs.what, 'econ')
        with:
          path: econ_cache
          key: econ-cache-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && startsWith(inputs.what, 'wx_')
        with:
          path: wx_cache
          key: wx-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(inputs.what, 'wx_')
        with:
          name: wxcast
          path: backtest/wxcast*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(inputs.what, 'bt')
        with:
          name: backtest
          path: backtest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(inputs.what, 'w5m_')
        with:
          name: w5m
          path: |
            bt_cache/w5m/
            bt_cache/kf/spot1s/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(inputs.what, 'lag_')
        with:
          name: livelag
          path: livelag_out/
          if-no-files-found: ignore
