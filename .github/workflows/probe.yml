name: probe
# Manual only: prints raw API shapes for debugging. No pushes, no state changes.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "all | kalshi | poly | endgame | events (or 'arbtest' / 'dryrun' / 'discover' / 'copytest' / 'depthtest' / 'makertest' for bot dry runs; edges_shapes|edges_rewards|edges_negrisk|edges_holding|edges_rewards2|edges_holding2|edges_round2|edges_all for edges.py research)"
        default: all

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4   # the branch it was started on (main by default), so a PR branch can be tried live
      - name: Probe APIs
        run: |
          case "${{ inputs.what }}" in edges_*) python3 edges.py "$(echo '${{ inputs.what }}' | sed 's/^edges_//')"; exit $?;; esac
          if [ "${{ inputs.what }}" = "arbtest" ] || [ "${{ inputs.what }}" = "dryrun" ] || [ "${{ inputs.what }}" = "discover" ] || [ "${{ inputs.what }}" = "copytest" ] || [ "${{ inputs.what }}" = "depthtest" ] || [ "${{ inputs.what }}" = "makertest" ]; then python3 bot.py "${{ inputs.what }}"; else python3 probe.py "${{ inputs.what }}"; fi
