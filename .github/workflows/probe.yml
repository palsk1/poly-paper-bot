name: probe
# Manual only: prints raw API shapes for debugging. No pushes, no state changes.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "all | kalshi | poly | endgame | events (or 'arbtest' / 'dryrun' / 'discover' / 'copytest' for bot dry runs; 'hunt' / 'hunt_ladders' / 'hunt_dupes' / 'hunt_rejected' / 'hunt_sports' for arbhunt.py)"
        default: all

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4   # the branch it was started on (main by default), so a PR branch can be tried live
      - name: Probe APIs
        run: |
          if [ "${{ inputs.what }}" = "arbtest" ] || [ "${{ inputs.what }}" = "dryrun" ] || [ "${{ inputs.what }}" = "discover" ] || [ "${{ inputs.what }}" = "copytest" ]; then python3 bot.py "${{ inputs.what }}"; elif [ "${{ inputs.what }}" = "hunt" ] || [ "${{ inputs.what }}" = "hunt_ladders" ] || [ "${{ inputs.what }}" = "hunt_dupes" ] || [ "${{ inputs.what }}" = "hunt_rejected" ] || [ "${{ inputs.what }}" = "hunt_sports" ]; then python3 arbhunt.py "${{ inputs.what }}"; else python3 probe.py "${{ inputs.what }}"; fi
