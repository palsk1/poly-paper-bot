name: probe
# Manual only: prints raw API shapes for debugging. No pushes, no state changes.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "all | kalshi | poly | endgame | events | fast | fast2 | fast3 (or 'arbtest' / 'dryrun' / 'discover' / 'copytest' / 'depthtest' / 'fasttest' / 'makertest' for bot dry runs; edges_* for edges.py research; sharp_* for sharp.py (bookmaker fair price); fast* and fasttest = weather + crypto; 'hunt' / 'hunt_ladders' / 'hunt_dupes' / 'hunt_rejected' / 'hunt_sports2' for arbhunt.py; 'rec_once' = one recorder pass)"
        default: all

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4   # the branch it was started on (main by default), so a PR branch can be tried live
      - uses: actions/cache/restore@v4
        if: startsWith(inputs.what, 'bt')
        with:
          path: bt_cache
          key: bt-cache-${{ github.run_id }}
          restore-keys: bt-cache-
      - name: Probe APIs
        run: |
          case "${{ inputs.what }}" in bt*) PYTHONUNBUFFERED=1 python3 backtest.py "${{ inputs.what }}"; exit $?;; esac
          case "${{ inputs.what }}" in rec_once) python3 recorder.py once; exit $?;; rec_6) PYTHONUNBUFFERED=1 python3 recorder.py once 6; exit $?;; esac
          case "${{ inputs.what }}" in sharp_*) PYTHONUNBUFFERED=1 python3 sharp.py "$(echo '${{ inputs.what }}' | sed 's/^sharp_//')"; exit $?;; esac
          case "${{ inputs.what }}" in edges_*) python3 edges.py "$(echo '${{ inputs.what }}' | sed 's/^edges_//')"; exit $?;; esac
          if [ "${{ inputs.what }}" = "arbtest" ] || [ "${{ inputs.what }}" = "dryrun" ] || [ "${{ inputs.what }}" = "discover" ] || [ "${{ inputs.what }}" = "copytest" ] || [ "${{ inputs.what }}" = "depthtest" ] || [ "${{ inputs.what }}" = "fasttest" ] || [ "${{ inputs.what }}" = "makertest" ]; then python3 bot.py "${{ inputs.what }}"; elif [ "${{ inputs.what }}" = "hunt" ] || [ "${{ inputs.what }}" = "hunt_ladders" ] || [ "${{ inputs.what }}" = "hunt_dupes" ] || [ "${{ inputs.what }}" = "hunt_rejected" ] || [ "${{ inputs.what }}" = "hunt_sports" ] || [ "${{ inputs.what }}" = "hunt_sports2" ]; then python3 arbhunt.py "${{ inputs.what }}"; else python3 probe.py "${{ inputs.what }}"; fi
      - uses: actions/cache/save@v4   # also after a failure or timeout, so a long download isn't lost
        if: always() && startsWith(inputs.what, 'bt')
        with:
          path: bt_cache
          key: bt-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(inputs.what, 'bt')
        with:
          name: backtest
          path: backtest/
          if-no-files-found: ignore
